<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KinContacts</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/stockage.js" defer></script>
  <script src="js/donnees.js" defer></script>
  <script src="js/affichage.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header>
    <button id="menu-button" type="button">☰</button>
    <span class="logo"><img src="icons/profil google.png" alt="" height="32" width="32"></span>
    <h1>KinContacts</h1>
    <div class="search-bar">
      <span class="search-icon"><img src="icons/ant-design--search-outlined.svg" alt="" height="20" width="20"></span>
      <input type="text" id="recherche" class="voirinput" placeholder="Rechercher" aria-label="Rechercher un contact">
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar open">
          <button type="button" class="creation-btn" id="creation-contact"><img class="img-plus" src="icons/akar-icons--plus.svg" alt="" height="20" width="20"> Créer un contact</button>

      <div id="popup">
        <div class="modal">
          
          <button id="close-button" type="button">X</button>
              <form id="contact-form">
              <h3 id="form-titre">Nouveau contact</h3>

            <label for="prenom">Prénom (obligatoire)</label>
            <input type="text" id="prenom" placeholder="Prénom" required>

            <label for="nom">Nom</label>
            <input type="text" id="nom" placeholder="Nom de famille">

            <label for="telephone">Téléphone</label>
            <input type="tel" id="telephone" placeholder="Téléphone">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Adresse email">

            <p id="form-error" role="alert"></p>

            <button type="reset" id="cancel-button">Annuler</button>
            <button type="submit" id="save-button">Enregistrer</button>
            </form>
        </div>
      </div>
      <a href="#" id="lien-contacts" class="active"><img src="icons/basil--user-solid.svg" alt="user" height="20" width="20"> Contacts</a>
      <a href="#" id="lien-favoris">⭐ Favoris</a>
      <a href="#"><img src="icons/akar-icons--folder-add.svg" alt="" height="20" width="20"> Frequent</a>
      <a href="#"><img src="icons/lucide--rotate-ccw-clock.svg" alt="" height="20" width="20"> Other contacts</a>
      <a href="#"><img src="icons/bi--tools.svg" alt="" height="20" width="20"> Merge et fix</a>
      <a href="#"><img src="icons/bytesize--import.svg" alt="" height="20" width="20"> Import</a>
      <a href="#"><img src="icons/bi--trash.svg" alt="" height="20" width="20"> Trash</a>
      <a href="#"> Labels +</a>
    </nav>

    <main>
      <button id="add-button" type="button">+</button>

      
      <h3 id="titre-liste">Contacts</h3>
      <div id="contacts-list"></div>
    </main>
  </div>

  <dialog id="fiche-dialog">
    <span id="fiche-avatar" class="avatar"></span>
    <h3 id="fiche-titre"></h3>
    <p id="fiche-telephone"></p>
    <p id="fiche-email"></p>
      <button type="button" id="fiche-modifier">Modifier</button>
      <button type="button" id="fiche-fermer">Fermer</button>
  </dialog>

  <footer>

  </footer>
</body>
</html>
